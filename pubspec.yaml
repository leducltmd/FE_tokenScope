name: tokenscope
description: "TokenScope - Nền tảng giám sát API trí tuệ nhân tạo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  cloud_firestore: ^7.1.0
  firebase_analytics: ^13.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  firebase_remote_config: ^7.0.1
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  http: ^1.6.0
  path_provider: ^2.1.6
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
