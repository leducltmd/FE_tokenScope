[project]
name = "tokenscope-e2e-tests"
version = "1.0.0"
description = "Google ARTEMIS E2E Automated Test Suite for TokenScope Flutter App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
python_files = ["test_*.py"]
