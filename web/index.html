<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tokenscope">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>tokenscope</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      Toàn bộ vùng hiển thị phải khớp chính xác với visual viewport.
      Nếu vùng chứa app ngắn hơn viewport (ví dụ dùng `height: 95vh`),
      engine sẽ nhận một `physicalSize` cũ và tính ra `viewInsets` âm —
      gây ra assertion "ViewInsets cannot be negative" (flutter/flutter#175074).
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #F7F8FA;
    }
    flutter-view {
      position: absolute;
      inset: 0;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    /*
      Chặn assertion "ViewInsets cannot be negative" của Flutter web engine.

      Đây là lỗi đã biết ở tầng engine (flutter/flutter#175074): khi bàn phím
      ảo bị ẩn hoặc cửa sổ trình duyệt resize, engine có thể tính ra
      `viewInsets.bottom` bị âm và `assert` trong
      `lib/_engine/engine/window.dart` bắn ra DartError.

      Lỗi này CHỈ xảy ra ở chế độ debug (bản release đã bị loại bỏ assert)
      và KHÔNG ảnh hưởng tới bố cục hiển thị, nên ta chỉ chặn thông báo
      để console không bị spam.

      Xem: https://github.com/flutter/flutter/issues/175074
    */
    (function () {
      var NEEDLE = 'ViewInsets cannot be negative';

      // 1. Lỗi này là một rejected promise không được xử lý.
      //    Chrome tự log "Uncaught (in promise) ..." — chặn event này.
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var text = reason && reason.message ? reason.message : String(reason);
        if (text.indexOf(NEEDLE) !== -1) {
          event.preventDefault();
          event.stopPropagation();
        }
      });

      // 2. Một số phiên bản engine log qua console.error thay vì event trên.
      var originalError = console.error;
      console.error = function () {
        var args = Array.prototype.slice.call(arguments);
        var first = args.length > 0 ? String(args[0]) : '';
        if (first.indexOf(NEEDLE) !== -1) {
          return;
        }
        originalError.apply(console, args);
      };
    })();
  </script>
</body>
</html>
